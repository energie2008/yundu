{{- if .Values.nodeService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yundu.fullname" . }}-node-service
  labels:
    {{- include "yundu.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-service
spec:
  type: {{ .Values.nodeService.service.type }}
  ports:
    - port: {{ .Values.nodeService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yundu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node-service
{{- end }}
