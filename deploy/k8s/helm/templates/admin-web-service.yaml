{{- if .Values.adminWeb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yundu.fullname" . }}-admin-web
  labels:
    {{- include "yundu.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-web
spec:
  type: {{ .Values.adminWeb.service.type }}
  ports:
    - port: {{ .Values.adminWeb.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "yundu.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-web
{{- end }}
