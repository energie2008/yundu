# YunDu CI 深度扫描
# 触发: push 到 main / pull_request
# 作业: lint (golangci-lint, 非阻塞) / security (gosec, -no-fail) / test (go test, 阻塞)
# 说明: Go monorepo (go.work, go 1.26)，与 release.yml 对齐：
#   - Go 版本 1.26（go.work 要求；旧值 1.22 无法编译 go 1.26 模块，三个 job 全挂）
#   - 测试采用子 shell cd 到模块目录（workspace 模式下 ./packages/... 顶层前缀无效）
#   - node-agent 编译标签 with_utls,with_wireguard,with_gvisor,with_quic,with_grpc,with_clash_api
# 注意: lint/security 为信息性扫描（非阻塞），test 为发布门禁（阻塞），与 release.yml 的 test job 一致

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    # 遗留代码库未经全量 lint 整改，设为信息性扫描：发现问题不阻断 CI
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # latest 跟随 Go 1.26（旧值 v1.59 仅支持到 Go 1.22，无法解析 go 1.26 语法）
          version: latest
          args: --timeout 5m

  security:
    name: Security (gosec)
    runs-on: ubuntu-latest
    # 安全扫描为信息性：gosec 自身异常不阻断 CI（findings 由 -no-fail 兜底）
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: gosec
        # 正确 action 仓库是 securego/gosec（旧值 securego/gosec-action 不存在，job 直接报错）
        uses: securego/gosec@master
        with:
          # -no-fail: 发现问题不退出非零（信息性扫描）；从 workspace 根扫描全部模块
          args: -no-fail ./...

  test:
    name: Test (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # Go workspace 模式下 ./packages/... 等顶层前缀模式无效
      # （报错 "directory prefix packages does not contain modules listed in go.work"）
      # 与 release.yml test job 完全一致：子 shell cd 到模块目录再 go test ./...
      - name: Test packages/subscription
        run: ( cd packages/subscription && go test ./... )

      - name: Test node-agent core packages
        run: ( cd apps/node-agent && go test ./internal/hotdiff/... ./internal/pipeline/... ./internal/validator/... ./internal/warp/... )
