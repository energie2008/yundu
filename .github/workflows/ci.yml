# YunDu CI 深度扫描
# 触发: push / pull_request
# 作业: lint (golangci-lint) / security (gosec) / test (go test -race)
# 说明: Go monorepo，依赖 sing-box 与 xray-core，编译标签
#       with_utls,with_wireguard,with_gvisor,with_quic,with_grpc,with_clash_api

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout 5m

  security:
    name: Security (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: gosec
        uses: securego/gosec-action@v2

  test:
    name: Test (go test -race)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Run tests
        run: go test -race ./packages/... ./apps/node-agent/internal/...
